<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sales training preview</title>
<style>
:root{--bg:#f4f6fa;--ink:#1b2a41;--mut:#5b6b82;--card:#fff;--bd:#d5dce8;--g:#1e9e5a;--a:#c77700;--r:#c93b3b}
*{box-sizing:border-box}body{margin:0;font-family:Calibri,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:14px 24px;color:#fff;display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px;margin:0}main{max-width:1050px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:14px}
.btn{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--c,#1b2a41);color:var(--ink);border-radius:12px;padding:14px 16px;margin:8px 0;font-size:16px;cursor:pointer;font-family:inherit}
.btn:hover{background:#eef3ff}.btn.pri{background:var(--c);color:#fff;font-weight:700;text-align:center}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.nav .btn{width:auto;display:inline-block;margin:0;padding:8px 14px;font-size:14px;border-color:var(--bd);background:#e9edf5}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:8px;padding:3px 10px;border:1px solid}
.v{color:var(--g);background:#e6f6ee;border-color:var(--g)}.t{color:var(--a);background:#fff3dc;border-color:var(--a)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.q{font-style:italic;font-size:20px;line-height:1.4}.mut{color:var(--mut)}
li{margin:7px 0;line-height:1.45}.shot{border:2px dashed var(--mut);background:#e9edf5;border-radius:10px;padding:30px;text-align:center;color:var(--mut)}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--bd);padding:7px 10px;text-align:left}th{background:#0b1f3a;color:#fff}
</style></head><body><div id="app"></div>
<script>
const P=[{"key":"sc","name":"LMS-K12","fullName":"LMS-K12 (ScholarClone / Scholar K-12)","color":"1F6FEB","tagline":"One system for a school: admissions, fees, attendance and results.","nameNote":"Portfolio name is ScholarClone (parent product \"Scholar K-12\"). Owner confirmed LMS-K12 = ScholarClone.","front":{"overview":{"bullets":["\"One system for a school: admissions, fees, attendance and results; ready lessons and assessments; teacher development; and career guidance from Grade 6.\"","Portfolio name ScholarClone, parent product \"Scholar K-12\". Delivered as SaaS (multi-tenant).","Guidance in the ICP: \"A school does not need to be digitised already: we digitise first.\"","Only the School ERP is live with a client today. Most of the rest of the range is prototype, in development or concept."],"src":"config/signals_icp.php (scholar_k12 pitch + guidance); config/portfolio_seed_data.json SCH-01..08","shot":"Scholar School ERP dashboard (insert screenshot)"},"modules":[{"title":"School ERP (SCH-01)  -  LIVE with client","bullets":["285 menus across 25 module groups: Admission, Fees, Student, Result, Attendance, Transport, Library, Hostel, Inventory, HRMS, LMS, SQAA and more.","Solves: school administration ERP (N12) and fee management (N13).","Segments: private K-12 schools, trusts / school chains.","References: Anand Niketan School (first live Scholar implementation); Lions Club of Silvassa (long-standing Campus ERP).","Seed note: settle ONE consistent traction figure before partners use it."],"src":"config/portfolio_seed_data.json SCH-01","shot":"Fees / Admission menu (insert screenshot)"},{"title":"Learning and intelligence offers  -  NOT live yet","bullets":["Fees Intelligence & Decision Support (SCH-02): fees dashboard, 63-signal DSS, Fees Action Centre. Status: PROTOTYPE (HTML prototypes exist).","LMS-PAL AI question generation (SCH-03): IN DEVELOPMENT.","Career Intelligence & Counselling (SCH-04): KASBA + NCDG framework, IPIP Big Five. IN DEVELOPMENT.","Learning ESO mastery paths (SCH-06): PILOT PLANNED (one-chapter pilot)."],"src":"config/portfolio_seed_data.json SCH-02, SCH-03, SCH-04, SCH-06","shot":"Prototype screens only (label them as prototype)"},{"title":"Concepts and bundle  -  PROPOSAL / CONCEPT","bullets":["Prompt-to-Video Lessons (SCH-05): teacher types a prompt, a pipeline produces a lesson video. Build status \"to confirm\".","School FTS / Digital Office (SCH-07): eOffice-style file tracking. Client-facing proposal prepared.","School Bundle (SCH-08): SCH-01 + SCH-03 + SCH-04 + G2G Education Pack. Seed note: \"Only the live components should be sold today.\"","G2G Education Pack (G2G-10): teacher CPD (competency + LMS + ESO). Concept."],"src":"config/portfolio_seed_data.json SCH-05, SCH-07, SCH-08, G2G-10","shot":"No product screens available"}],"problems":{"bullets":["School administration ERP (N12) and fee management & financial intelligence (N13)  -  SCH-01, SCH-02.","LMS and AI content generation (N14)  -  SCH-03, SCH-05.","Student career guidance (N15)  -  SCH-04.   Digital office / file tracking (N16)  -  SCH-07.","Learning mastery & personalised learning (N18)  -  SCH-06.   Teacher professional development (N17)  -  G2G-10.","NOT documented: customer-language problem statements. Use discovery questions to get the customer's own words."],"src":"config/portfolio_seed_data.json (needs_solved codes) + config/g2g_taxonomy.php labels"},"customers":{"bullets":["Segments: private K-12 schools (K12-PVT), school trusts / chains (K12-TRUST); K12-GOVT for LMS-PAL and FTS.","Internal ICP: private K-12 schools and school groups in Gujarat, Dadra & Nagar Haveli and Daman & Diu, and Maharashtra. Priority cities: Ahmedabad, Mumbai, Pune, Surat, Vadodara, Rajkot, Vapi, Nashik.","Trigger signals: new school or expansion; school-ERP tender; trust publicly seeking ERP/LMS.","Named competitors (internal list only): Teachmint, Entab, Fedena, Edunext, Campus365, MyClassboard, Illumine, Schoolpad.","Internal ICP numeric thresholds are for qualification only. Do not quote them to customers."],"src":"config/signals_icp.php (scholar_k12); config/signals_products.php"},"benefits":{"verified":["Single-system scope across admissions, fees, attendance and results (pitch line).","Digitise-first approach: the school need not be digitised already.","Breadth of the live ERP: 285 menus across 25 module groups."],"missing":["Quantified benefits, ROI, time or cost savings","Unique selling points vs named competitors","Testimonials or case studies","Pricing, deal band, implementation effort"],"src":"Portfolio schema has no benefits / USP / testimonial fields"},"proof":{"bullets":["Anand Niketan School  -  first live Scholar implementation.","Lions Club of Silvassa  -  long-standing Campus ERP.","LMS-PAL v4 is listed in CGTMSE scope. A client-facing proposal exists for School FTS.","No approved traction figure, case study, metric or testimonial exists. Do not invent one."],"src":"config/portfolio_seed_data.json proof_points"},"readiness":{"rows":[["School ERP (SCH-01)","Live - with client"],["Fees Intelligence & DSS (SCH-02)","Prototype"],["LMS-PAL AI questions (SCH-03)","In development"],["Career Intelligence (SCH-04)","In development"],["Prompt-to-Video (SCH-05)","Proposal / concept"],["Learning ESO (SCH-06)","Pilot planned"],["School FTS / Digital Office (SCH-07)","Proposal / concept"],["School Bundle (SCH-08)","Proposal / concept"]],"notes":["Every offer has readiness_confirmed = false: no administrator has confirmed these labels yet.","Admin-journey docs flag some LMS screens as hardcoded / placeholder (Quiz, Subjects/Chapters, /lms/reports); the Coherence Map is \"known broken\". Do not demo them."]},"missing":["Pricing, deal band, implementation effort, delivery owner (all \"To fill\")","Approved client count / traction figure","Product screenshots and logo (none in the repos)","Feature-level comparison with competitors","Benefits, USPs, testimonials, ROI"]},"persona":{"name":"Mrs. Hetal Parekh","role":"Principal and trustee, a private K-12 school in Gujarat","initial":"H","bullets":["Fees are tracked in spreadsheets and parents keep calling the office for fee status.","Attendance and results are compiled by hand at term end.","Has heard of Teachmint and Entab. Wants one system, not four.","Decides with her trustee board at its next meeting."],"note":"FICTIONAL training persona. Her situation is an assumption to practise discovery, not a documented customer."},"decisions":[{"stage":"Customer introduction & requirements","stageNums":[1,2],"scene":"Mrs. Parekh: \"A trustee mentioned Scholar. I only have thirty minutes. Can you show me what it does?\"","sceneM":"She checks her watch: \"Let us be quick. What exactly can you do for my school?\"","prompt":"How do you open the meeting?","options":[{"rating":"partial","label":"Give a two-minute overview of the ERP modules, then ask what she would like to see first.","react":"\"Fine. I did not realise there were so many modules. I mainly care about fees.\"","result":"She engages, but you learn her priority only after spending your best minutes on a general tour.","coach":"A short overview is safe, but questions first would have saved time and shown you are listening."},{"rating":"best","label":"Ask about how admissions, fees, attendance and results run today and which one hurts most, before presenting anything.","react":"\"Nobody asks that first. Honestly, fee follow-up eats my office staff's week.\"","result":"She names her top pain in her own words and starts talking freely. You now have a thread to follow.","coach":"Discovery before pitch. The portfolio holds no customer-language problem statements, so only discovery can give you one."},{"rating":"poor","label":"Present the whole range: ERP, AI lesson videos, career intelligence and the bundle.","react":"\"That sounds like a lot. Is all of that running in schools now?\"","result":"You have promised items that are concept, in development or prototype. She asks the one question you cannot answer well.","coach":"Only the School ERP is live. Seed note on the bundle: \"Only the live components should be sold today.\""}],"recovery":{"line":"She frowns: \"You have shown me a lot of things I cannot verify. What is actually working today?\"","good":"Say you overreached: the School ERP is live; the rest is roadmap. Ask what she needs first.","bad":"Insist everything is \"basically ready\" and keep presenting."},"lost":"\"I need a partner who tells me what works. We will look elsewhere.\""},{"stage":"Identifying business problems","stageNums":[3],"scene":"Mrs. Parekh: \"Fees are the worst part. Also my teachers need better lesson material, and I want career guidance for senior students one day.\"","sceneM":"Still guarded: \"Fees are the worst part. The rest I am not sure about. I do not want to be oversold.\"","prompt":"Three problems on the table. What do you do?","options":[{"rating":"poor","label":"Promise to solve all three together, because Scholar covers fees, lessons and careers.","react":"\"All three? Then I want a date for each.\"","result":"You have committed to deliverables that are not live. She will hold you to dates you cannot give.","coach":"Lessons (LMS-PAL) and careers are in development. Do not blur live and planned."},{"rating":"best","label":"Confirm fees as the priority, ask what \"bad\" means (follow-up, receipts, reports), and park lessons and careers as later conversations.","react":"\"Yes, exactly: receipts, dues lists, and who has paid. Good that you focus.\"","result":"The problem is now specific, and you earn the right to recommend something precise next.","coach":"Prioritise, quantify with the customer's own words, and keep roadmap items separate."},{"rating":"partial","label":"Note all three, then say you will come back with ideas for each.","react":"\"All right. Please do not make it complicated.\"","result":"You keep every door open but give her nothing concrete today. Interest stays lukewarm.","coach":"Capturing everything is fine; failing to prioritise leaves the customer without a next step."}],"recovery":{"line":"\"You said you would solve everything. Now I am confused about what you really offer.\"","good":"Reset: say fees is the first target, state which parts are live, and offer to scope the rest later.","bad":"Say \"you misunderstood\" and repeat the full list."},"lost":"\"I will wait. I do not want a vendor who promises everything.\""},{"stage":"Product recommendation","stageNums":[4],"scene":"Mrs. Parekh: \"So what would you suggest for my school?\"","sceneM":"Cautiously: \"Be straight with me. What do you suggest, and what is ready now?\"","prompt":"What do you recommend?","options":[{"rating":"partial","label":"Recommend the School ERP and mention that AI lessons and careers \"are coming soon\".","react":"\"Coming soon... when exactly?\"","result":"The core recommendation is sound, but \"coming soon\" invites a date you do not have.","coach":"Say in development or planned, and say you will confirm timelines. Avoid vague \"soon\"."},{"rating":"poor","label":"Recommend the Fees Intelligence DSS (63 signals) as the main solution to her fee problem.","react":"\"A dashboard with 63 signals? Can I see it with my own data?\"","result":"The DSS is only a prototype (HTML prototypes exist). You have positioned an unbuilt product as the answer.","coach":"SCH-02 is a PROTOTYPE. Sell the live ERP fees module; mention the DSS as a prototype if relevant."},{"rating":"best","label":"Recommend the School ERP (live with a client) starting with Fees and Admission. Say AI lessons and careers are in development and will be discussed separately.","react":"\"I like that you separated what is live from what is not.\"","result":"She trusts the recommendation and wants to see the fees workflow.","coach":"Anchor on the live offer (SCH-01) and label everything else with its true status."}],"recovery":{"line":"\"A prototype? You positioned it as the solution. How do I trust the rest?\"","good":"Own the mistake, refocus on the live ERP fees module, and offer to show a real screen.","bad":"Argue that a prototype is \"the same thing\" as a product."},"lost":"\"If a prototype was sold to me as a product, I cannot sign anything.\""},{"stage":"Product demonstration","stageNums":[5],"scene":"You are in the demo. Mrs. Parekh: \"Show me how fees work for my front-office team.\"","sceneM":"She leans back: \"Show me something real. No slides.\"","prompt":"How do you run the demo?","options":[{"rating":"poor","label":"Open the LMS area to impress her with Quiz and the new interactive content.","react":"\"This page looks empty... is it supposed to be like this?\"","result":"Some LMS screens (Quiz, Subjects/Chapters, /lms/reports) are flagged as hardcoded or placeholder in the admin-journey docs. The demo stumbles on one.","coach":"Check the admin-journey flags before a demo and stay on screens that are real."},{"rating":"best","label":"Walk her fee workflow in a demo tenant: Fees and Admission menus, tied to the dues and receipt problem she described.","react":"\"This is what my staff would use every day. Can parents also see their dues?\"","result":"The demo is her story, not a feature tour. She asks a buying question.","coach":"Demo the customer's problem on live screens. A question like hers you can answer only from the live fees area, so verify before you promise."},{"rating":"partial","label":"Click through all 25 module groups quickly to show breadth.","react":"\"There is a lot here. I cannot tell which parts matter for me.\"","result":"The 285-menu breadth is impressive, but she leaves unsure what applies to her.","coach":"Breadth (285 menus, 25 groups) is verified, but breadth is not relevance. Tie each screen to a stated need."}],"recovery":{"line":"Awkward silence. \"Is this feature finished? I do not want to pay for something half built.\"","good":"Be honest: that screen is not ready. Switch to the live fees module and show it working.","bad":"Claim it is \"just loading slowly\" and keep clicking."},"lost":"\"If the demo itself breaks, I do not trust the product.\""},{"stage":"Handling questions and objections","stageNums":[6,7],"scene":"Mrs. Parekh: \"We used an older ERP and our staff hated the change. How many schools like mine run Scholar today? Can I speak to one?\"","sceneM":"Sharper now: \"How many schools run this? I have been burned before. Give me real names.\"","prompt":"How do you answer the reference question?","options":[{"rating":"poor","label":"\"Over fifty schools already use it.\"","react":"\"Fifty! Then I will ask the trust board to call a few of them.\"","result":"There is no approved client count anywhere in the portfolio. You made it up, and she will check.","coach":"Never state a number you cannot source. The seed explicitly says to settle one traction figure first."},{"rating":"partial","label":"\"Several schools use it successfully. I will send details later.\"","react":"\"Several? Send names, please.\"","result":"You avoid a lie but stay vague. She asks you to follow up and trust slips a little.","coach":"Vague claims invite precise follow-ups. Use the documented references and say what you cannot yet state."},{"rating":"best","label":"Name the two documented references (Anand Niketan School; Lions Club of Silvassa), say no larger client figure is approved yet, and offer to ask whether a reference conversation can be arranged.","react":"\"Honest. I would like to hear from Anand Niketan.\"","result":"She values the candour. The staff-resistance concern becomes a topic for a shared plan.","coach":"Use documented proof, state the limit, and promise only an attempt, not an outcome."}],"recovery":{"line":"\"I called around and cannot find fifty. Where did that number come from?\"","good":"Admit it: you cannot source that number. Offer the two real references and apologise.","bad":"Say the number is \"a rough estimate\" and move on."},"lost":"\"A vendor who invents numbers is not one I can put in front of my trustees.\""},{"stage":"Competitor comparison","stageNums":[8],"scene":"Mrs. Parekh: \"I am also talking to Teachmint and Entab. Why should I pick you?\"","sceneM":"Arms folded: \"Teachmint and Entab both gave me demos. Why you?\"","prompt":"How do you handle the comparison?","options":[{"rating":"best","label":"Ask what she liked and what was missing in those demos, then position Scholar on its documented scope (one system across admissions, fees, attendance, results) without comparing features you cannot verify.","react":"\"They were good at attendance but I could not see the fees story. Tell me more about yours.\"","result":"She teaches you the evaluation criteria and you respond to them honestly.","coach":"No competitor feature data exists in the portfolio. Ask, listen, and stay on facts you can source."},{"rating":"poor","label":"Say those tools are unreliable and lack proper fee management.","react":"\"How do you know that? Have you used them?\"","result":"You made unverifiable claims about named competitors. You sound defensive, and it can reflect badly on the company.","coach":"Disparaging named rivals without evidence is unverified and risky."},{"rating":"partial","label":"Stress that Scholar has 285 menus across 25 module groups, more than she saw elsewhere.","react":"\"I did not count their menus. Does more menus mean better for me?\"","result":"The figure is real, but you implied a comparison you cannot back and she is unconvinced.","coach":"The 285-menu figure is verified; \"more than competitors\" is not. Breadth alone is not a reason to buy."}],"recovery":{"line":"\"You criticised them without facts. Is that how you will treat me later?\"","good":"Retract the claim, apologise, and ask what criteria matter to her.","bad":"Double down: \"everyone knows they are unreliable\"."},"lost":"\"I cannot work with someone who runs down others without proof.\""},{"stage":"Price and negotiation","stageNums":[9],"scene":"Mrs. Parekh: \"Fine. What does it cost? And my trustees will want a discount for being an early customer.\"","sceneM":"Pointedly: \"I need a price today, and a discount. Otherwise my trustees will not listen.\"","prompt":"How do you respond on price?","options":[{"rating":"partial","label":"Promise \"the best discount we can do\" without a figure and say you will get approval later.","react":"\"Good. I will tell the trustees a discount is coming.\"","result":"You have signalled a concession without authority. She now expects one you may not be able to give.","coach":"Do not pre-announce discounts. Pricing is not defined in the portfolio (\"To fill\")."},{"rating":"poor","label":"Quote a per-student fee on the spot to look decisive.","react":"\"That seems low... is it really that cheap? Put it in writing.\"","result":"No approved price exists. A made-up figure is now a promise the company may have to honour or retract.","coach":"Never invent pricing. Pricing, deal band and effort are all \"To fill\" in the portfolio."},{"rating":"best","label":"Say pricing depends on scope and has not been fixed yet. Agree the modules and school size, commit to a written proposal by a date, and negotiate scope and phasing rather than price.","react":"\"That is fair. I would rather have the right proposal than a rushed number.\"","result":"She accepts the process. You hold the discount conversation until you have authority.","coach":"Trade scope and timing, not unapproved numbers, and commit to dated next steps."}],"recovery":{"line":"\"Your office has just told me that figure is wrong. Which is it?\"","good":"Withdraw the figure, apologise, and explain that an approved proposal will follow.","bad":"Insist the figure stands and ask her to sign."},"lost":"\"Moving the price after I was told one is a deal-breaker.\""},{"stage":"Closing the deal, and follow-up","stageNums":[10,11],"scene":"Mrs. Parekh: \"I think we are close. The trustees meet next week. What happens next?\"","sceneM":"She says carefully: \"The trustees meet next week. I am still not certain. What do I tell them?\"","prompt":"How do you close, and what do you plan after?","options":[{"rating":"poor","label":"Press her to sign today, saying the offer closes next week.","react":"\"I cannot sign before the board. And what offer?\"","result":"There is no documented time-limited offer. You manufactured pressure she can see through.","coach":"Invented deadlines and offers break trust. Respect her decision process."},{"rating":"best","label":"Recap agreed scope (live ERP, fees first), send a written recap within a day, offer a one-page summary for the trustees, book a date to review, and name who on both sides owns the next step.","react":"\"That one page will help. Let us meet the day after the board.\"","result":"She leaves with a clear plan and a document to carry into the boardroom. The relationship has momentum.","coach":"Closing is agreeing the next concrete step with an owner and a date, then following up in writing."},{"rating":"partial","label":"Ask \"so are we good to go?\" and leave it open until she calls.","react":"\"I will let you know after the board.\"","result":"She is positive but there is no owner, date or document. Momentum depends on her remembering you.","coach":"Do not leave closing open-ended. Put a dated follow-up and a recap in place."}],"recovery":{"line":"\"You are pushing me and I do not like it. Why the hurry?\"","good":"Back off, apologise, and agree a written recap and a post-board meeting date.","bad":"Repeat that the offer ends next week."},"lost":"\"I do not buy under pressure. Please do not contact me again.\""}],"outcomes":{"won":{"title":"Deal won: school-wide ERP engagement agreed","text":"Mrs. Parekh takes the one-page summary to her trustees and the board approves a phased rollout of the School ERP, fees first. You promised only what was live.","lessons":["You separated live from roadmap throughout.","You sourced every proof point and never invented a number.","You traded scope and timing, not unapproved price."]},"wonConc":{"title":"Deal won, with concessions","text":"The trustees approve, but you gave away expectations along the way (an early-discount hint, loose timelines). Delivery will have to manage them.","lessons":["Concessions without authority cost you later.","Restore trust with a precise written scope.","Review the decisions where confidence wavered."]},"stalled":{"title":"Deal stalled: not lost, not won","text":"The trustees defer the decision. Mrs. Parekh remains open but unconvinced. A dated, evidence-based follow-up could still revive it.","lessons":["Open-ended closing leaves momentum to chance.","Come back with documented proof and a precise scope.","Replay the decisions where confidence dropped."]},"lost":{"title":"Deal lost","text":"The relationship ends. Review the decision where trust broke and replay it.","lessons":["Trust is lost faster than it is built.","Replay the decision and try the alternative."]}}},{"key":"g2g","name":"G2G","fullName":"G2G (Scholar CCB, v1 docs)","color":"0E9F8E","tagline":"Capability and competency workflows, with HR operations built in.","nameNote":"The expansion of \"G2G\" is not documented. The v1 docs expand CCB two different ways (\"Competency & Capacity Building\" and \"Competency & Career Builder\").","front":{"overview":{"bullets":["Platform description: \"Capability and competency workflows\" - role, skill and development-path intelligence over its own taxonomy.","Scholar CCB (v1 docs): integrated human capital and talent management for educational organizations, covering the staff lifecycle from recruitment to capability tracking.","CCB modules in the docs: HRIT (Attendance, Leave, Payroll), Talent Management, Capability Intelligence, G2G LMS, Task Management; the index also lists Organization Management.","Scale per the docs index: about 55 frontend routes, 30 backend controllers and 50 database tables."],"src":"lms-k12.vercel.app/docs/1.0.0/ccb; packages/ai-intelligence-core/src/solutions.ts","shot":"G2G dashboard / HRIT home (insert screenshot)"},"modules":[{"title":"HRIT: Attendance, Leave, Payroll  -  docs status: Complete (parts Partial)","bullets":["Attendance: punch in/out, calendar, KPI dashboard, regularization flow, weekly summary. Reports with filters; CSV export is client-side.","Leave: apply / approve / reject / send back / cancel, bulk decisions, balances, dashboard, three reports (Summary, Register, Balance). Leave year April-March.","Payroll: payroll types, salary-structure grid, Form 16 and salary-certificate screens. PF/PT re-derived server-side.","PARTIAL per the docs: monthly payroll run, payroll deduction, attendance policy and request center. Bank transfer file (NACH/NEFT) is a v2 idea."],"src":"docs/1.0.0/ccb/hrit/attendance-tracking, attendance-reports, leave-management, leave-configuration, payroll-processing, salary-structure","shot":"Attendance calendar, Leave dashboard, Salary-structure grid (insert screenshots)"},{"title":"Talent Management and Capability Intelligence","bullets":["Talent Management (overview page): onboarding roadmaps, goal setting, 360 performance appraisal, offboarding. Appraisal flow: Self -> Peer -> Evaluator -> Management confirmation.","Capability Intelligence (overview page): skill mapping, competency gap analysis, training needs, succession matrices.","Reports catalog: Competency Gap Report, Skills Matrix, Employee Skills Report; Recruitment Pipeline, Onboarding Status, Performance Review Summary, Offboarding.","No dedicated documentation pages exist for these modules; only the overview and reports catalog describe them."],"src":"docs/1.0.0/ccb (overview); docs/1.0.0/ccb/REPORTS","shot":"Competency library / Gap report (insert screenshot)"},{"title":"G2G LMS and Task Management","bullets":["G2G LMS: professional development for faculty and administrative upskilling, certifications and compliance. Menu: Learning Dashboard, Catalog, My Learning, Assignments, Sessions, Certifications, Course Builder, Assessments.","Reports: Learning Progress, Certification, Assignment Completion, Assessment Results.","Task Management: dashboard, My Tasks, projects and workstreams, calendar, reports; Task Report and Task Audit Log.","Portfolio: Competency-linked learning (G2G-04) and Task Execution with ESO (G2G-07) are IN DEVELOPMENT."],"src":"docs/1.0.0/ccb (overview, index menu); docs/1.0.0/ccb/REPORTS; portfolio_seed_data.json G2G-04, G2G-07","shot":"Learning catalog / My Learning (insert screenshot)"},{"title":"Portfolio offers (G2G-01 to G2G-10)","bullets":["Competency Framework Studio (01): role-to-competency frameworks, FRAC-aligned for government capacity building.","KASBA Capability Library (02): 3,572 job-role tasks across 268 job roles and 128 skills. Seed note: Knowledge/Ability/Attitude/Behaviour items are thin (about 10 each).","Capability Gap Assessment (03): competency rating on a 6-level scale, expected competency, self-rating, Q&A assessment, gap reports.","Also: Talent Management (05), HRIT/HRMS Core (06), Workforce AI Assistant (08), Hospital ICU nurse pack (09, pilot planned), Education Pack (10)."],"src":"config/portfolio_seed_data.json G2G-01 to G2G-10","shot":"Framework studio / Gap assessment (insert screenshot)"}],"problems":{"bullets":["Competency framework design / FRAC mapping (N01) and capability gap assessment (N02).","Role and task library / job architecture (N03); competency-linked learning and CPD (N04).","Talent, succession and career pathing (N05); core HRMS / HR digitization (N06).","Task execution and SOP automation (N07); agentic / conversational AI for workforce (N08); regulatory / accreditation readiness (N20).","NOT documented: customer-language problem statements."],"src":"config/portfolio_seed_data.json needs_solved + config/g2g_taxonomy.php"},"customers":{"bullets":["Portfolio segments: central, state and urban-local-body government; PSUs; training institutes; hospitals; universities; SMEs (100-500 employees); enterprises.","The leading ICP for G2G business development is the SME (100-500 people), via the SME Capability + Intelligence Bundle (concept).","BUT the v1 docs describe CCB as built for educational organizations. Fit for other sectors must be confirmed with the customer.","No G2G ICP template exists (icp_template = null).","Trigger signals: CBP rollout, empanelment/tender, new CHRO or L&D leader, NAAC/NABH accreditation, SME funding."],"src":"config/portfolio_seed_data.json BUN-01; config/signals_products.php; docs/1.0.0/ccb"},"benefits":{"verified":["Attendance data flows into payroll: \"linked directly to Payroll - attendance data flows into monthly payroll computation\" (docs sales note).","Replaces paper attendance registers and Excel salary sheets (docs sales notes).","Built-in approval chains: leave, appraisal, and payroll with manual HR verification before bank file export.","Documented library scale: 3,572 tasks, 268 roles, 128 skills; FRAC-aligned frameworks."],"missing":["Quantified benefits, ROI, time or cost savings","Unique selling points vs named competitors","Testimonials or case studies","Pricing (docs: \"pricing TBD, part of CCB base tier\")"],"src":"docs/1.0.0/ccb/hrit/*; portfolio seed G2G-02"},"proof":{"bullets":["G2G-01: \"Live in g2gv0 under Capability Intelligence; no production tenant yet.\"","G2G-03: self-rating and Q&A assessment already built. G2G-08: conversational AI and agentic library built.","G2G-10 is part of the CGTMSE proposal scope.","No G2G offer is \"Live - with client\". No client, case study or testimonial is documented."],"src":"config/portfolio_seed_data.json proof_points"},"readiness":{"rows":[["Competency Framework Studio (01)","Built - no production client"],["KASBA Capability Library (02)","Built - no production client"],["Capability Gap Assessment (03)","Built - no production client"],["Competency-linked Learning (04)","In development"],["Talent Management (05)","Built - no production client"],["HRIT / HRMS Core (06)","Built - no production client"],["Task Execution with ESO (07)","In development"],["Workforce AI Assistant (08)","In development"],["Hospital ICU Pack (09)","Pilot planned"],["Education Pack (10)","Proposal / concept"]],"notes":["Every offer has readiness_confirmed = false.","Docs mark as PARTIAL: monthly payroll run, payroll deduction, attendance policy, request center, multi-level leave approval UI. Leave validations (past dates, overlaps, insufficient balance) are \"TBD\"."]},"missing":["Pricing, deal band, implementation effort, delivery owner","Any production client or case study","Expansion of the \"G2G\" name; consistent CCB name","Dedicated docs for Talent, Capability, G2G LMS, Task, Organization","Items the docs themselves mark TBD","Screenshots (none in repos)"]},"persona":{"name":"Rohan Mehta","role":"Head of HR and L&D, a company of about 300 people","initial":"R","bullets":["Attendance, leave and payroll prep run on registers and Excel; month-end is stressful.","Managers do not know which skills their teams lack; training is generic.","Is also looking at established HRMS tools.","Will need his CEO's approval for anything beyond a pilot."],"note":"FICTIONAL training persona. The situation is an assumption to practise discovery, not a documented customer."},"decisions":[{"stage":"Customer introduction & requirements","stageNums":[1,2],"scene":"Rohan Mehta: \"A colleague gave me your name. We run HR on Excel. What exactly is G2G?\"","sceneM":"Guarded: \"I have seen many vendor decks. Be brief: what is G2G?\"","prompt":"How do you open?","options":[{"rating":"poor","label":"Walk through every module and the AI agents roadmap in one go.","react":"\"That is a long list. Which of these actually exist?\"","result":"Several items you mentioned (AI assistant, task execution) are still in development. He starts doubting you.","coach":"Lead with what he needs. Keep in-development items clearly labelled."},{"rating":"best","label":"Ask about team size, how attendance, leave and payroll run today, whether capability or training is a priority, and what he wants to fix first.","react":"\"Good questions. Payroll prep takes my team nearly a week and I have no skills picture at all.\"","result":"He opens up with two distinct problems. You now know where to aim.","coach":"Discovery separates operations from capability needs. No customer-language problem statements are documented."},{"rating":"partial","label":"Give a one-line description (\"capability and competency workflows\") and ask what he is looking for.","react":"\"Capability and competency... I do not quite know what that means for me.\"","result":"The line is accurate but abstract. He still needs to translate it into his own problem.","coach":"Use plain business language and tie it to the customer's world early."}],"recovery":{"line":"\"You have listed many things. Can you tell me, honestly, which ones I can use today?\"","good":"Acknowledge it was too much; say what is built, what is in development, and ask what he needs first.","bad":"Say \"all of it, basically\" and continue."},"lost":"\"I do not have time for vendors who cannot tell me what is real. Goodbye.\""},{"stage":"Identifying business problems","stageNums":[3],"scene":"Rohan: \"Two things hurt: payroll prep takes days because I consolidate attendance by hand, and I cannot tell which skills my teams are missing.\"","sceneM":"Cautiously: \"Payroll prep is painful, and I have no skills picture. I do not want a big project though.\"","prompt":"How do you handle the two problems?","options":[{"rating":"partial","label":"Say G2G solves both, immediately.","react":"\"Both? That sounds too good. How?\"","result":"You are right in principle, but he now wants proof you have not yet earned.","coach":"Two problems need two answers. Separate them and ask which costs more."},{"rating":"poor","label":"Promise payroll prep time will drop by half.","react":"\"Half! In writing, please.\"","result":"No ROI or time-saving figure is documented. You have given a number you cannot support.","coach":"Never state savings figures that are not sourced. Ask him to estimate his own baseline instead."},{"rating":"best","label":"Separate operations (attendance-to-payroll) from capability (skill gaps), ask which costs more and how he measures it, then agree a first focus.","react":"\"Payroll first. But the skills problem is why I am talking to you at all.\"","result":"He ranks the two problems, giving you a phased approach and his true motivation.","coach":"Quantify with the customer's own numbers. Do not substitute your own."}],"recovery":{"line":"\"I asked for half and now you say you cannot confirm? Which is it?\"","good":"Retract the number, apologise, and propose to measure his current prep time together.","bad":"Say \"it was an average\" and keep going."},"lost":"\"A made-up number from the first meeting? I cannot trust the rest.\""},{"stage":"Product recommendation","stageNums":[4],"scene":"Rohan: \"So what would you propose?\"","sceneM":"Still wary: \"What would you propose, and what is ready today?\"","prompt":"What do you recommend?","options":[{"rating":"poor","label":"Recommend Task Execution with ESO and the AI agents as the future of his HR operations.","react":"\"Interesting, but I need payroll and skills now. Is this live?\"","result":"Task execution and the AI assistant are IN DEVELOPMENT. You have led with the least ready part.","coach":"Lead with built capabilities. In-development items are roadmap only."},{"rating":"best","label":"Start with HRIT (attendance, leave, payroll link), then a capability gap assessment in phase two. Say plainly that G2G offers are built but no production client exists yet.","react":"\"Phased makes sense. And thanks for being straight about no production client.\"","result":"The recommendation matches both problems and his risk appetite, and sets up a pilot.","coach":"Anchor on built offers (G2G-06, G2G-03) with honest status: \"Built - no production client\"."},{"rating":"partial","label":"Recommend the SME bundle (gap assessment + HRMS core + Enterprise Brain + AI assistant) as the full answer.","react":"\"A bundle... how much is it, and is it all available?\"","result":"The bundle is a proposal/concept with pricing to define, and parts are in development. You have over-sized the offer.","coach":"BUN-01 is a concept. Recommend its built parts first."}],"recovery":{"line":"\"You said AI agents first. If those are not ready, why did you lead with them?\"","good":"Apologise, say they are in development, and reset to HRIT and gap assessment.","bad":"Say they are \"nearly ready\" and move on."},"lost":"\"I need someone who leads with what works.\""},{"stage":"Product demonstration","stageNums":[5],"scene":"Rohan: \"Show me how attendance and leave would work for my staff, and how it reaches payroll.\"","sceneM":"Skeptically: \"Show me real screens, not slides.\"","prompt":"How do you run the demo?","options":[{"rating":"partial","label":"Show only the competency library and skills screens, since that is the exciting part.","react":"\"Nice library. But it does not answer my payroll question.\"","result":"He sees the capability side but his main problem is untouched.","coach":"Demo the problem he ranked first."},{"rating":"poor","label":"Promise a live monthly payroll run and bank transfer file export in the demo.","react":"\"Great, let me see the bank file.\"","result":"The monthly payroll run is PARTIAL in the docs and the bank transfer file is a v2 idea. The demo cannot deliver what you promised.","coach":"Check the docs status before promising. Do not demo screens marked TBD."},{"rating":"best","label":"Demo the documented flows: punch in/out, a leave request and its approval, and the salary-structure grid, showing how attendance feeds payroll. Say what is partial.","react":"\"I can see my staff using this. What is partial?\"","result":"The demo answers his core question honestly and he asks a precise follow-up.","coach":"Stick to screens marked Complete: attendance, leave, salary structure. State the partial parts plainly."}],"recovery":{"line":"\"The bank file is missing. You told me it was part of the demo. What else did you overstate?\"","good":"Admit the monthly run is partial and the bank file is planned, then show the complete flows.","bad":"Blame the demo environment and promise it will \"work next week\"."},"lost":"\"The demo was promised and not delivered. Thank you, but no.\""},{"stage":"Handling questions and objections","stageNums":[6,7],"scene":"Rohan: \"Your documentation talks about educational institutions. Is this built for a company like mine? And do you have any company running this in production?\"","sceneM":"Sharply: \"Your docs talk about schools. Is this really for a company like mine? Any company running it?\"","prompt":"How do you respond?","options":[{"rating":"poor","label":"Say several companies in his industry already run G2G.","react":"\"Which ones? I will call them.\"","result":"No G2G offer has a production client. He will discover the claim is false.","coach":"Never claim clients you cannot source."},{"rating":"partial","label":"Say G2G works for any organisation.","react":"\"Any organisation? Then why does your documentation say schools?\"","result":"The claim is broader than your documentation, and he spots the gap.","coach":"The documentation scope is educational organizations. The portfolio lists SMEs as target. Neither proves fit."},{"rating":"best","label":"Acknowledge that v1 docs describe educational organisations and no G2G offer has a production client yet, then propose a scoped pilot to validate fit on his own data with clear success criteria.","react":"\"I appreciate the honesty. A scoped pilot with clear criteria is something I can take to my CEO.\"","result":"The objection becomes a shared validation plan, and your credibility rises.","coach":"Turn a limitation into a structured test. State what is and is not documented."}],"recovery":{"line":"\"I asked around and nobody has heard of such a client. Why did you say that?\"","good":"Retract, apologise, and say there is no production client yet; propose a pilot.","bad":"Say the client \"prefers to stay anonymous\"."},"lost":"\"A false claim about clients is the end of this conversation.\""},{"stage":"Competitor comparison","stageNums":[8],"scene":"Rohan: \"I am also comparing established HRMS tools. Why G2G?\"","sceneM":"He leans in: \"I have an established HRMS vendor pitching me. Why G2G?\"","prompt":"How do you handle the comparison?","options":[{"rating":"partial","label":"Emphasise the AI assistant and agentic library as what competitors lack.","react":"\"Your AI assistant is it live? And you know what they have?\"","result":"The AI assistant is in development, and no competitor data exists in your materials. The claim is double-weak.","coach":"Conversational AI is in development; and a comparison needs evidence."},{"rating":"best","label":"Ask which tools and what criteria matter, then position on what is documented: attendance linked to payroll, plus a competency and capability layer in the same platform. Avoid feature claims about rivals.","react":"\"They are strong on HR basics but have nothing on competency. That is why I am here.\"","result":"He volunteers the gap himself. You stay credible and let him draw conclusions.","coach":"No competitor data exists in the portfolio for G2G. Ask criteria, then connect documented strengths."},{"rating":"poor","label":"Say established HRMS tools do not have any competency library.","react":"\"They do offer skills modules. Where did you get that?\"","result":"You have made an unverified claim about competitors. He knows his vendor better than you do.","coach":"Unverified comparisons damage credibility."}],"recovery":{"line":"\"That is simply not true. What else do you say that is not true?\"","good":"Retract, apologise, and ask what he values in his current candidates.","bad":"Insist your statement is correct."},"lost":"\"Please do not contact me again.\""},{"stage":"Price and negotiation","stageNums":[9],"scene":"Rohan: \"What would the pilot cost? And I expect a pilot discount.\"","sceneM":"Firmly: \"I need a pilot price now, with a discount, or I cannot take it to my CEO.\"","prompt":"How do you respond?","options":[{"rating":"poor","label":"Quote a per-employee monthly price to keep momentum.","react":"\"That works. Send it in writing.\"","result":"Pricing is \"To fill\" for every G2G offer, and docs say \"pricing TBD\". Your number has no authority behind it.","coach":"Never invent pricing."},{"rating":"best","label":"Say pricing has not been defined yet. Agree pilot scope, duration and success criteria, and commit to a written proposal by a date. Negotiate scope, not an unapproved price.","react":"\"Fine. A scoped proposal by Friday works for me.\"","result":"He accepts a structured next step. You keep the pricing conversation until you have authority.","coach":"When there is no approved price, trade scope and timing."},{"rating":"partial","label":"Offer the pilot free of charge to win the deal.","react":"\"Free? That is excellent. Put it in writing.\"","result":"You have committed commercial terms without authority. Reversing it later will damage trust.","coach":"Free offers need approval. Do not give away value you cannot authorise."}],"recovery":{"line":"\"Your manager says the price you quoted was wrong. Which number is real?\"","good":"Withdraw the figure, apologise, and say an approved proposal will follow.","bad":"Insist the number is final."},"lost":"\"Changing terms after promising them is unacceptable.\""},{"stage":"Closing the deal, and follow-up","stageNums":[10,11],"scene":"Rohan: \"I am inclined to try the pilot. What happens next?\"","sceneM":"Carefully: \"I am still unsure. What happens next, and what do I tell my CEO?\"","prompt":"How do you close, and plan the follow-up?","options":[{"rating":"partial","label":"Ask \"are we good to go?\" and wait for him to revert.","react":"\"I will revert after talking to my CEO.\"","result":"He is positive but there is no owner, date or document. Momentum depends on his memory.","coach":"Close with concrete next steps, not hope."},{"rating":"poor","label":"Tell him the pilot slot is limited and ask him to commit today.","react":"\"Limited slots? Since when? I do not like pressure.\"","result":"There is no documented slot limit. You invented urgency.","coach":"Do not manufacture scarcity."},{"rating":"best","label":"Recap agreed pilot scope and success criteria, send a written recap within a day with an executive summary for the CEO, book a review date, and name who owns each next step.","react":"\"That summary is exactly what my CEO needs. Let us meet on the review date.\"","result":"He has a plan, a document, and a date. The pilot proceeds with clear expectations.","coach":"Closing is a written plan with owners and dates, then disciplined follow-up."}],"recovery":{"line":"\"You are pushing me. If that is how the sales process feels, how will delivery feel?\"","good":"Back off, apologise, and agree a written recap and a review date.","bad":"Repeat that the slot is limited."},"lost":"\"I will not be pushed. We are done.\""}],"outcomes":{"won":{"title":"Deal won: scoped pilot agreed","text":"Rohan's CEO approves a scoped HRIT pilot with a capability gap assessment as phase two. Expectations match what is built.","lessons":["You separated built from in-development throughout.","You turned the \"no production client\" limitation into a pilot plan.","You never invented price, savings or clients."]},"wonConc":{"title":"Deal won, with concessions","text":"The pilot is approved, but a free-pilot hint and loose expectations will need careful management in delivery.","lessons":["Unauthorised concessions create delivery risk.","Restore clarity with a written scope.","Review decisions where confidence wavered."]},"stalled":{"title":"Deal stalled: not lost, not won","text":"Rohan postpones. He remains open but wants proof. A dated follow-up with documented evidence could revive it.","lessons":["Open-ended closing leaves momentum to chance.","Return with documented proof and a precise pilot plan.","Replay the decisions where confidence dropped."]},"lost":{"title":"Deal lost","text":"The relationship ends. Review the decision where trust broke and replay it.","lessons":["Trust is lost faster than it is built.","Replay the decision and try the alternative."]}}},{"key":"eb","name":"Enterprise Brain","fullName":"Enterprise Brain (portfolio: EB / HP Enterprise Brain)","color":"7A3FD1","tagline":"An intelligence layer above a company's existing ERP and HR systems.","nameNote":"Enterprise Brain is a separate product from G2G (shares a database, owns hpbrain_* tables). Its own repo and README are not available to this project.","front":{"overview":{"bullets":["\"Intelligence layer installed above a company's ERP/HR systems; verdicts over reports, UNDETERMINED as a designed state.\"","Design claims in the portfolio: a 10-stage intelligence loop (Signal ... Learning) and a seven-question sufficiency gate.","Platform description: \"Institution intelligence and automation. Asks for signals, deliberation and agent execution over the whole organisation.\"","Deployment: installable layer on client systems. Separate product from G2G."],"src":"config/portfolio_seed_data.json EB-01; packages/ai-intelligence-core/src/solutions.ts; docs/phase3/10-open-questions.md Q-C4","shot":"Enterprise Brain dashboard (insert screenshot)"},"modules":[{"title":"Intelligence Layer (EB-01) and Data Ingestion (EB-03)","bullets":["EB-01 Intelligence Layer: status \"Proven on real client data (pilot)\". Proof: golden-intelligence pipeline end to end on FiberValley (ISP) and Lions School data.","EB-03 Data Ingestion Engine: Ingestion Engine plus Evidence Ledger; onboard an organisation from Excel or exports with traceable evidence. Status: Built - no production client. Used for FiberValley Excel imports.","Solves: organisational intelligence / decision support (N09) and data consolidation from existing systems (N11)."],"src":"config/portfolio_seed_data.json EB-01, EB-03","shot":"Ingestion / Evidence ledger (insert screenshot)"},{"title":"Department and Person Intelligence (EB-02), KASBA Scoring (EB-05)","bullets":["EB-02: department health on measured dimensions, plus a separate data-confidence view, per department and per person. Status: IN DEVELOPMENT. Screens are under redesign (verdict-first). FiberValley CST used as reference.","EB-05 KASBA Scoring and Gap Analysis: shared scoring engine, mostly sold inside G2G-03 / EB-01. Status: Built - no production client."],"src":"config/portfolio_seed_data.json EB-02, EB-05","shot":"Department health (insert screenshot; screens are under redesign)"},{"title":"Knowledge & Memory, and the in-app menu","bullets":["EB-04: Graph Explorer, KASBA Explorer, Knowledge & Memory, AI Assistant, ESO Library. Status: IN DEVELOPMENT.","Menu in the K-12 admin docs: Organization overview, Foundation, Capabilities, Ingestion, Intelligence Loop (Signals, Evidence, Deliberation, Workspace, Executions), Governance, Analytics, Knowledge, Automation, Settings.","The Governance screen (decision approval trail) currently renders \"Not available\". Do not demo it."],"src":"config/portfolio_seed_data.json EB-04; lms_k12/docs/admin-user-journey.md","shot":"Intelligence Loop / Knowledge screens (insert screenshot)"}],"problems":{"bullets":["Organisational intelligence / decision support (N09).","Data consolidation from existing systems (Excel/ERP) (N11).","Knowledge management / company brain (N10).","Agentic / conversational AI for workforce (N08); capability gap assessment (N02).","NOT documented: customer-language problem statements."],"src":"config/portfolio_seed_data.json needs_solved + config/g2g_taxonomy.php"},"customers":{"bullets":["Segments: SME, enterprise, PSU (EB-01, EB-03); hospital (EB-05).","Trigger signals: enterprise digital transformation announcement; enterprise seeking knowledge management or organisational intelligence; adjacent-market tenant pattern (\"FiberValley-like\").","No ICP exists for Enterprise Brain (icp_template = null; B2B ICP not set up).","Reference organisations: FiberValley (ISP) and Lions School data. These prove data was processed, not that they are paying customers."],"src":"config/portfolio_seed_data.json; config/signals_products.php"},"benefits":{"verified":["Designed to decline giving a verdict when evidence is insufficient: UNDETERMINED is a designed state.","Evidence Ledger: findings are traceable to source evidence.","Department health is shown with a separate data-confidence view.","Can onboard an organisation from Excel exports (used for FiberValley)."],"missing":["Any quantified benefit, ROI or outcome","Unique selling points vs named competitors","Testimonials, case studies, paid client confirmation","Pricing","The names of the ten intelligence-loop stages (only \"Signal\" and \"Learning\" are named)"],"src":"config/portfolio_seed_data.json EB-01..05"},"proof":{"bullets":["EB-01: golden-intelligence pipeline end to end on FiberValley (ISP) and Lions School data (pilot).","EB-03: used for FiberValley Excel imports.","EB-02: FiberValley CST used as reference.","No testimonial, metric or paid-client confirmation exists. Do not extend design claims into outcome claims."],"src":"config/portfolio_seed_data.json proof_points"},"readiness":{"rows":[["Intelligence Layer (EB-01)","Proven on real client data (pilot)"],["Dept & Person Intelligence (EB-02)","In development"],["Data Ingestion Engine (EB-03)","Built - no production client"],["Knowledge & Memory + AI Assistant (EB-04)","In development"],["KASBA Scoring & Gap Analysis (EB-05)","Built - no production client"]],"notes":["Every offer has readiness_confirmed = false.","Governance screen shows \"Not available\". EB-02 screens are under redesign. EB-04 sidebar is being consolidated."]},"missing":["Marketing description and category","Pricing, deal band, implementation effort, delivery owner","ICP, case studies, testimonials","Names of the 10 intelligence-loop stages","The product repo and README (not available to this project)","Screenshots"]},"persona":{"name":"Anita Rao","role":"COO of a mid-size services company","initial":"A","bullets":["Receives reports from ERP, HR and Excel files that often disagree.","Leaders argue over whose numbers are right before every review.","Wary of \"AI dashboards\" that give confident answers on weak data.","Her CEO wants a decision-support approach within the year."],"note":"FICTIONAL training persona. The situation is an assumption to practise discovery, not a documented customer."},"decisions":[{"stage":"Customer introduction & requirements","stageNums":[1,2],"scene":"Anita Rao: \"People tell me Enterprise Brain makes our reports smarter. What is it?\"","sceneM":"Dry: \"I have heard a lot of AI promises. What is Enterprise Brain, concretely?\"","prompt":"How do you open?","options":[{"rating":"best","label":"Ask how decisions get made today, which reports she trusts or distrusts, and where her numbers come from, before describing anything.","react":"\"Every Monday three reports show three different numbers. That is my problem.\"","result":"She names a concrete pain and gives you the ground to explain the evidence-based approach.","coach":"Enterprise Brain's documentation is thin. Discovery is your main source of customer language."},{"rating":"poor","label":"Say it is an AI brain that understands the whole company and gives answers instantly.","react":"\"Instantly? From what data? How will I know it is right?\"","result":"The claim overreaches. The product is designed to refuse a verdict when evidence is insufficient.","coach":"Do not oversell. Its documented design is evidence-first, not instant answers."},{"rating":"partial","label":"Read her the portfolio one-liner: an intelligence layer above ERP and HR systems that produces verdicts over reports.","react":"\"Verdicts over reports... what does that mean for my Monday meeting?\"","result":"The line is accurate but abstract. She cannot yet see herself in it.","coach":"Accurate but abstract. Link the description to her situation."}],"recovery":{"line":"\"An AI brain with all the answers? Then why are you not showing me anything?\"","good":"Back up: say it is an evidence-based layer, and ask about her reporting pain.","bad":"Repeat that it knows everything."},"lost":"\"I have heard this AI story before. Not interested.\""},{"stage":"Identifying business problems","stageNums":[3],"scene":"Anita: \"Our data lives in ERP, HR files and a lot of Excel. We spend more time arguing about numbers than deciding.\"","sceneM":"Carefully: \"Data in ERP, HR files and Excel. I do not want another tool nobody trusts.\"","prompt":"How do you frame her problem?","options":[{"rating":"poor","label":"Promise the product will end all reporting arguments.","react":"\"All of them? That seems unrealistic.\"","result":"You promised an outcome that is not documented. The product's own design admits when evidence is insufficient.","coach":"Do not extend design claims into outcome claims."},{"rating":"best","label":"Frame it as data consolidation from existing systems plus traceable evidence. Ask which decision hurts most and which sources conflict.","react":"\"The monthly review. Finance and operations never agree on the figures.\"","result":"She picks a precise decision and two conflicting sources. A pilot target emerges.","coach":"Map the problem to documented needs: consolidation (N11) and decision support (N09)."},{"rating":"partial","label":"Say the product can sit above all her systems and fix the mess.","react":"\"Fix the mess how? I need to understand the approach.\"","result":"Directionally right, but a promise to \"fix\" without method invites doubt.","coach":"Describe the approach, not a rescue."}],"recovery":{"line":"\"You said it would end the arguments. How, exactly? Be honest.\"","good":"Walk it back: it consolidates data and exposes evidence so arguments become traceable; outcomes depend on her data.","bad":"Reassure her with \"trust me, it works\"."},"lost":"\"I do not trust promises without method.\""},{"stage":"Product recommendation","stageNums":[4],"scene":"Anita: \"What would you actually put in front of me?\"","sceneM":"She presses: \"What would you really put in front of me, and is it ready?\"","prompt":"What do you recommend?","options":[{"rating":"partial","label":"Recommend the full Enterprise Brain: intelligence layer, department intelligence, knowledge and AI assistant.","react":"\"All of it... is all of it ready?\"","result":"Two of the five offers are in development. You have bundled unready parts into the recommendation.","coach":"EB-02 and EB-04 are in development. Recommend what is ready, and label the rest."},{"rating":"best","label":"Recommend a scoped pilot: Data Ingestion plus the Intelligence Layer on one decision area. Say the layer has been proven in a pilot on FiberValley and Lions School data and has no production client yet.","react":"\"A pilot on one decision I can choose. That is something I can say yes to.\"","result":"She sees a bounded step, and your honesty about the pilot-only status builds trust.","coach":"Use the documented readiness: EB-01 proven in pilot, EB-03 built with no production client."},{"rating":"poor","label":"Lead with the Department & Person Intelligence dashboards as the headline feature.","react":"\"Show me those dashboards, please.\"","result":"EB-02 is in development and its screens are under redesign. You have led with something you cannot demo.","coach":"Do not lead with unbuilt features."}],"recovery":{"line":"\"You told me about dashboards you cannot show. What exactly is real?\"","good":"Apologise, name what is proven in pilot and what is not, and refocus on the pilot.","bad":"Say the dashboards are \"being finalised\" and move on."},"lost":"\"If you cannot show it, I cannot buy it.\""},{"stage":"Product demonstration","stageNums":[5],"scene":"Anita: \"Show me how it would handle my conflicting numbers.\"","sceneM":"She says: \"Show me, not tell me. Only what really works.\"","prompt":"How do you run the demo?","options":[{"rating":"poor","label":"Open the Governance screen to show the decision approval trail.","react":"\"This says Not available. Is it broken?\"","result":"The Governance screen currently renders \"Not available\". The demo exposes an unfinished area.","coach":"Do not demo screens known to be unavailable."},{"rating":"best","label":"Show ingestion from an Excel export into the Evidence Ledger, then the Intelligence Loop on a pilot dataset, including an UNDETERMINED result. Say which screens are still under redesign.","react":"\"It says it cannot decide here? Good - I would rather know than guess.\"","result":"The UNDETERMINED state, usually seen as a gap, becomes a trust signal. She asks how evidence is traced.","coach":"Demo the strongest documented design claims on real screens, and label gaps."},{"rating":"partial","label":"Walk through the whole menu: Foundation, Capabilities, Intelligence Loop, Analytics, Knowledge, Automation.","react":"\"A lot of menus. Which of these matter for my Monday meeting?\"","result":"The breadth is real, but she cannot tell what applies. Several areas are in development or being redesigned.","coach":"Demo the path to her problem, not the menu."}],"recovery":{"line":"She frowns: \"Not available? Is the product even finished?\"","good":"Be candid: that screen is not ready. Switch to the ingestion and evidence flow.","bad":"Say it is a \"loading issue\" and click around."},"lost":"\"If the demo itself shows an unavailable screen, I cannot proceed.\""},{"stage":"Handling questions and objections","stageNums":[6,7],"scene":"Anita: \"Which companies use this in production? And what if the system gives a wrong answer?\"","sceneM":"Pointed: \"Who uses this in production? And what happens when it is wrong?\"","prompt":"How do you respond?","options":[{"rating":"partial","label":"Say several enterprises use it and the AI is highly accurate.","react":"\"Highly accurate. Do you have numbers for that?\"","result":"You have given two claims without evidence. She asks for the figures you do not have.","coach":"No accuracy metric or production-client list is documented."},{"rating":"poor","label":"Quote an accuracy percentage from a past project.","react":"\"Can I see the report behind that number?\"","result":"No accuracy figure exists in the portfolio. You cannot produce a source.","coach":"Never state performance numbers you cannot source."},{"rating":"best","label":"Be specific: the layer has been proven in a pilot on FiberValley and Lions School data; there is no production client yet. And it is designed to say UNDETERMINED rather than guess when evidence is thin.","react":"\"Honest, and the UNDETERMINED part is the first time I have heard a vendor talk about being wrong.\"","result":"Her second concern becomes the product's strength. A pilot feels reasonable.","coach":"Use documented proof and design principles. Do not create a metric."}],"recovery":{"line":"\"I asked for the report behind that number and nobody can find it. Did you invent it?\"","good":"Admit you cannot source it, apologise, and explain the documented pilot proof.","bad":"Say the report is confidential."},"lost":"\"You gave me a number you could not back. We are finished.\""},{"stage":"Competitor comparison","stageNums":[8],"scene":"Anita: \"I am also looking at business-intelligence dashboards from large vendors. Why not those?\"","sceneM":"Firmly: \"A large BI vendor offered dashboards. Why would I choose you?\"","prompt":"How do you compare?","options":[{"rating":"poor","label":"Say BI dashboards are shallow and never give real intelligence.","react":"\"That is a broad claim. Have you tested them?\"","result":"No competitor analysis exists for Enterprise Brain. The statement is unverified.","coach":"Do not make unsupported claims about rival categories."},{"rating":"best","label":"Ask what she expects from a dashboard tool, then explain what is documented: a layer on top of existing systems, traceable evidence, verdicts that can say UNDETERMINED. Say you have no verified head-to-head comparison.","react":"\"The traceable evidence matters. My team gets blamed for numbers nobody can trace.\"","result":"She ties documented design to her own pain and keeps you in the evaluation.","coach":"No competitor data exists for EB. State that and let the design speak."},{"rating":"partial","label":"Say Enterprise Brain complements dashboards, so she need not choose.","react":"\"Complements how? What would I keep?\"","result":"A reasonable positioning, but you cannot yet explain integration specifics.","coach":"Plausible, but be ready to explain how. Do not claim integrations that are not documented."}],"recovery":{"line":"\"You dismissed the tools I am considering without facts. Why should I trust you?\"","good":"Withdraw the claim and ask what she needs from such a tool.","bad":"Say \"everyone in the industry knows\"."},"lost":"\"Please do not run down other products without evidence.\""},{"stage":"Price and negotiation","stageNums":[9],"scene":"Anita: \"What would the pilot cost? My CEO wants a number.\"","sceneM":"Firmly: \"I need a number for my CEO today.\"","prompt":"How do you respond?","options":[{"rating":"partial","label":"Offer to do the pilot at cost, \"to prove the value\".","react":"\"At cost? Good. Please confirm in writing.\"","result":"You committed commercial terms without authority. Reversing it will cost trust.","coach":"Do not offer terms you cannot authorise."},{"rating":"best","label":"Say pricing has not been set yet. Agree a pilot scope, one decision area and data sources, plus success criteria, and commit to a written proposal by a date.","react":"\"Understood. A scoped proposal I can give my CEO is better than a guess.\"","result":"She accepts a dated, scoped proposal. You protect the commercial position.","coach":"Trade scope and timing, not an unapproved price."},{"rating":"poor","label":"Quote a yearly licence fee to appear confident.","react":"\"Good, send me the proposal with that number.\"","result":"Pricing, deal band, effort and delivery owner are all \"To fill\". Your number has no basis.","coach":"Never invent pricing."}],"recovery":{"line":"\"Finance says that number is not approved. Why did you quote it?\"","good":"Withdraw the figure, apologise, and commit to an approved proposal.","bad":"Say finance is wrong."},"lost":"\"A quote that is not real ends this.\""},{"stage":"Closing the deal, and follow-up","stageNums":[10,11],"scene":"Anita: \"I like the pilot idea. What happens next?\"","sceneM":"Cautiously: \"I am interested but not convinced. What happens next?\"","prompt":"How do you close and follow up?","options":[{"rating":"partial","label":"Say \"let me know when you are ready\" and leave it with her.","react":"\"Sure. I will let you know.\"","result":"No owner, date or document. The deal depends on her remembering.","coach":"Do not leave closing open-ended."},{"rating":"best","label":"Recap the pilot: one decision area, data sources, UNDETERMINED handling, success criteria and owners. Send a written recap within a day, plus a one-page note for her CEO, and book a review date.","react":"\"That note is what my CEO needs. Let us review on the date.\"","result":"She has a plan, a document and a date. The pilot gets a clear start.","coach":"Close with a written plan, owners and a date. Then follow up."},{"rating":"poor","label":"Say pilot data capacity is limited and she must commit today.","react":"\"Limited how? That sounds like pressure.\"","result":"There is no documented capacity limit. You invented urgency.","coach":"Do not manufacture scarcity."}],"recovery":{"line":"\"You are pressuring me. That is not how I choose partners.\"","good":"Step back, apologise, and agree a written recap and review date.","bad":"Repeat that capacity is limited."},"lost":"\"I do not work with pressure. Goodbye.\""}],"outcomes":{"won":{"title":"Deal won: scoped evidence pilot agreed","text":"Anita's CEO approves a pilot on one decision area, with ingestion and the intelligence layer, and clear criteria for UNDETERMINED results.","lessons":["You led with what is proven in pilot and labelled the rest.","You turned \"no production client\" into a bounded pilot.","You never invented accuracy, price or client claims."]},"wonConc":{"title":"Deal won, with concessions","text":"The pilot is approved, but loose commercial hints and some soft claims will need careful handling in delivery.","lessons":["Unauthorised concessions create delivery risk.","Restore clarity with a written pilot scope.","Review decisions where confidence wavered."]},"stalled":{"title":"Deal stalled: not lost, not won","text":"Anita postpones. She is intrigued by the evidence approach but wants more proof. A dated follow-up could revive it.","lessons":["Open-ended closing leaves momentum to chance.","Return with documented pilot evidence and a precise plan.","Replay the decisions where confidence dropped."]},"lost":{"title":"Deal lost","text":"The relationship ends. Review the decision where trust broke and replay it.","lessons":["Trust is lost faster than it is built.","Replay the decision and try the alternative."]}}}];
const RT={best:['BEST MOVE','var(--g)'],partial:['PARTIAL - ACCEPTABLE BUT COSTLY','var(--a)'],poor:['POOR DECISION','var(--r)']};
let cur={t:'home'},hist=[];
const $=document.getElementById('app');
const P_=k=>P.find(p=>p.key===k);
function go(n){hist.push(cur);cur=n;render();window.scrollTo(0,0)}
function back(){if(hist.length){cur=hist.pop();render()}}
window.go=go;window.back=back;
function dest(p,i,lane,r){const last=i===p.decisions.length-1;
 if(lane==='S'){if(r==='best')return last?{t:'out',k:p.key,o:'won'}:{t:'dec',k:p.key,i:i+1,l:'S'};
  if(r==='partial')return last?{t:'out',k:p.key,o:'wonConc'}:{t:'dec',k:p.key,i:i+1,l:'M'};return{t:'rec',k:p.key,i}}
 if(r==='best')return last?{t:'out',k:p.key,o:'wonConc'}:{t:'dec',k:p.key,i:i+1,l:'S'};
 if(r==='partial')return last?{t:'out',k:p.key,o:'stalled'}:{t:'dec',k:p.key,i:i+1,l:'M'};return{t:'lost',k:p.key,i}}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const J=o=>esc(JSON.stringify(o)).replace(/"/g,'&quot;');
const B=(label,o,cls)=>'<button class="btn '+(cls||'')+'" onclick="go('+J(o)+')">'+esc(label)+'</button>';
const nav=(p,extra)=>'<div class="nav"><button class="btn" onclick="go({t:\'home\'})">Home</button><button class="btn" onclick="back()">Back</button>'+(p?'<button class="btn" onclick="go({t:\'hub\',k:\''+p.key+'\'})">Product hub</button><button class="btn" onclick="go({t:\'map\',k:\''+p.key+'\'})">Scenario map</button>':'')+(extra||'')+'</div>';
const ul=a=>'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
const prov=v=>'<span class="tag '+(v?'v':'t')+'">'+(v?'VERIFIED PRODUCT FACTS':'TRAINING SCENARIO - fictional customer')+'</span>';
function shell(p,title,body,v){document.title=title;$.innerHTML='<header style="background:'+(p?p.color:'#0b1f3a')+'"><h1>'+esc(title)+'</h1><span>'+prov(v===true)+'</span></header><main style="--c:'+(p?p.color:'#0b1f3a')+'">'+body+nav(p)+'</main>'}
function render(){const c=cur,p=c.k&&P_(c.k);
 if(c.t==='home')return shell(null,'Interactive Sales Training: preview','<div class="grid">'+P.map(q=>'<div class="card" style="border-top:6px solid '+q.color+'"><h2 style="color:'+q.color+'">'+esc(q.name)+'</h2><p>'+esc(q.tagline)+'</p><p class="mut" style="font-size:13px">'+esc(q.nameNote)+'</p>'+B('Open '+q.name,{t:'hub',k:q.key},'pri').replace('class="btn pri"','class="btn pri" style="--c:'+q.color+'"')+'</div>').join('')+'</div><p class="mut">Preview only. Nothing is stored. Personas and customer lines are fictional training content.</p>');
 if(c.t==='hub'){const items=[['Overview','overview'],['Modules and offers','modules'],['Customer problems solved','problems'],['Target customers','customers'],['Benefits and USPs','benefits'],['Use cases and proof','proof'],['Readiness and limitations','readiness'],['What we cannot claim','missing']];
  return shell(p,p.name+' - Product hub','<p class="mut">'+esc(p.tagline)+'</p><div class="grid">'+items.map(([l,id])=>B(l,{t:'info',k:p.key,id})).join('')+'</div><div class="card" style="margin-top:14px"><h3>Practise the sale</h3><p>Branching simulation with '+esc(p.persona.name)+', '+p.decisions.length+' decisions across 11 stages.</p>'+B('Meet the customer',{t:'persona',k:p.key},'pri')+'</div>',true)}
 if(c.t==='info'){const F=p.front;let title,body,v=true;
  const sh=s=>s?'<div class="shot">Screenshot placeholder<br>'+esc(s)+'</div>':'';
  if(c.id==='overview'){title='Overview';body='<div class="card">'+ul(F.overview.bullets)+'<p class="mut">Source: '+esc(F.overview.src)+'</p></div>'+sh(F.overview.shot)}
  else if(c.id==='modules'){title='Modules and offers';body=F.modules.map((m,i)=>B(m.title,{t:'mod',k:p.key,i})).join('')}
  else if(c.id==='problems'){title='Customer problems solved';body='<div class="card">'+ul(F.problems.bullets)+'<p class="mut">Source: '+esc(F.problems.src)+'</p></div>'}
  else if(c.id==='customers'){title='Target customers';body='<div class="card">'+ul(F.customers.bullets)+'<p class="mut">Source: '+esc(F.customers.src)+'</p></div>'}
  else if(c.id==='benefits'){title='Benefits and USPs';body='<div class="three"><div class="card" style="background:#e6f6ee"><h3>Documented (you may say this)</h3>'+ul(F.benefits.verified)+'</div><div class="card" style="background:#fdeaea"><h3>NOT documented (do not claim)</h3>'+ul(F.benefits.missing)+'</div></div>'}
  else if(c.id==='proof'){title='Use cases and proof points';body='<div class="card">'+ul(F.proof.bullets)+'<p class="mut">Source: '+esc(F.proof.src)+'</p></div>'}
  else if(c.id==='readiness'){title='Readiness and limitations';body='<table><tr><th>Offer</th><th>Portfolio readiness status</th></tr>'+F.readiness.rows.map(r=>'<tr><td>'+esc(r[0])+'</td><td><b>'+esc(r[1])+'</b></td></tr>').join('')+'</table><div class="card" style="margin-top:12px;background:#fff3dc"><h3>Limitations</h3>'+ul(F.readiness.notes)+'</div>'}
  else {title='What we cannot claim: missing information';body='<div class="card" style="background:#fdeaea"><p><b>No source exists for these. If asked, say you will confirm and come back.</b></p>'+ul(F.missing)+'</div>'}
  return shell(p,title,body+B('Back to product hub',{t:'hub',k:p.key},'pri'),v)}
 if(c.t==='mod'){const m=p.front.modules[c.i];return shell(p,m.title,'<div class="card">'+ul(m.bullets)+'<p class="mut">Source: '+esc(m.src)+'</p></div><div class="shot">Screenshot placeholder<br>'+esc(m.shot)+'</div>'+B('Back to modules',{t:'info',k:p.key,id:'modules'}),true)}
 if(c.t==='persona')return shell(p,'Meet the customer','<div class="card"><h2>'+esc(p.persona.name)+'</h2><p class="mut">'+esc(p.persona.role)+'</p>'+ul(p.persona.bullets)+'<p style="color:var(--a)"><i>'+esc(p.persona.note)+'</i></p></div>'+B('Start the scenario',{t:'dec',k:p.key,i:0,l:'S'},'pri'));
 if(c.t==='map')return shell(p,'Scenario map: replay any decision','<div class="grid">'+p.decisions.map((d,i)=>B('Decision '+(i+1)+' | Stage'+(d.stageNums.length>1?'s '+d.stageNums.join('-'):' '+d.stageNums[0])+' | '+d.stage,{t:'dec',k:p.key,i,l:'S'})).join('')+'</div><p class="mut">Stages: 1 Introduction, 2 Requirements, 3 Business problems, 4 Recommendation, 5 Demonstration, 6 Questions, 7 Objections, 8 Competitors, 9 Price and negotiation, 10 Closing, 11 Follow-up.</p>');
 if(c.t==='dec'){const d=p.decisions[c.i];const S=c.l==='S';
  return shell(p,d.stage+'  ('+(c.i+1)+'/'+p.decisions.length+')','<div class="card"><b>'+esc(p.persona.name)+'</b> <span class="mut">'+esc(p.persona.role)+'</span><p class="q">'+esc(S?d.scene:d.sceneM)+'</p><span class="tag '+(S?'v':'t')+'">Customer confidence: '+(S?'STRONG':'WAVERING')+'</span></div><h3>'+esc(d.prompt)+'</h3>'+d.options.map((o,j)=>B(String.fromCharCode(65+j)+'.  '+o.label,{t:'fb',k:p.key,i:c.i,l:c.l,j})).join(''))}
 if(c.t==='fb'){const d=p.decisions[c.i],o=d.options[c.j],r=RT[o.rating],to=dest(p,c.i,c.l,o.rating);
  const conf=to.t==='dec'?(to.l==='S'?'Strong':'Wavering'):to.t==='rec'?'At risk':to.t==='out'?'Final outcome':'Deal lost';
  return shell(p,'Decision '+(c.i+1)+' result','<p style="font-size:18px;font-weight:700;color:'+r[1]+'">'+r[0]+'</p><p class="mut"><i>You chose: '+esc(o.label)+'</i></p><div class="three"><div class="card"><h3>Customer reaction</h3><p>'+esc(o.react)+'</p></div><div class="card"><h3>Consequence</h3><p>'+esc(o.result)+'</p></div><div class="card"><h3>Coaching</h3><p>'+esc(o.coach)+'</p></div></div><p><b style="color:'+r[1]+'">Customer confidence after this move: '+conf+'</b></p>'+B('Continue',to,'pri')+B('Return to decision',{t:'dec',k:p.key,i:c.i,l:c.l}))}
 if(c.t==='rec'){const d=p.decisions[c.i],last=c.i===p.decisions.length-1;
  return shell(p,'Recovery moment','<div class="card" style="background:#fdeaea"><p class="q">'+esc(d.recovery.line)+'</p><b style="color:var(--r)">Customer confidence: AT RISK</b></div><h3>How do you respond?</h3>'+B(d.recovery.good,last?{t:'out',k:p.key,o:'stalled'}:{t:'dec',k:p.key,i:c.i+1,l:'M'})+B(d.recovery.bad,{t:'lost',k:p.key,i:c.i})+B('Return to decision',{t:'dec',k:p.key,i:c.i,l:'S'}))}
 if(c.t==='lost'){const d=p.decisions[c.i];return shell(p,p.outcomes.lost.title,'<div class="card" style="background:#fdeaea"><p class="q">'+esc(d.lost)+'</p></div><p>Decision '+(c.i+1)+': '+esc(d.stage)+'. Replay it and try a different approach.</p>'+B('Replay decision '+(c.i+1),{t:'dec',k:p.key,i:c.i,l:'S'},'pri')+B('Start over',{t:'dec',k:p.key,i:0,l:'S'}))}
 if(c.t==='out'){const o=p.outcomes[c.o],tier={won:'Excellent',wonConc:'Good, with room to improve',stalled:'Needs work'}[c.o];
  return shell(p,o.title,'<div class="card"><p style="font-size:18px">'+esc(o.text)+'</p></div><div class="card"><h3>Sales performance evaluation: '+tier+'</h3>'+ul(o.lessons)+'</div>'+B('Replay the scenario',{t:'dec',k:p.key,i:0,l:'S'},'pri')+B('Review decisions (map)',{t:'map',k:p.key}))}
}
render();
</script></body></html>
